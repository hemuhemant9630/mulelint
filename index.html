<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%221.5%22 y=%227%22 width=%228%22 height=%2210%22 rx=%222%22 fill=%22none%22 stroke=%22%2315212b%22 stroke-width=%221.8%22/%3E%3Cpath d=%22M9.5 12h4%22 stroke=%22%2315212b%22 stroke-width=%221.8%22/%3E%3Crect x=%2213.5%22 y=%227%22 width=%229%22 height=%2210%22 rx=%222%22 fill=%22%230e5560%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MuleLint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Best-practice checks for Mule 4 apps. Drop a JAR and get every finding with its file, line and fix. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky bar, then one centred 1180px column; the report splits into a 300px summary rail and the findings list. */
:root {
  --paper: #edf0f2;
  --sheet: #f8f9fa;
  --ink: #15212b;
  --ink-2: #3d4a56;
  --ink-3: #66727e;
  --line: #d3d9de;
  --line-strong: #b4bdc5;
  --petrol: #0e5560;
  --petrol-ink: #0a3f48;
  --petrol-wash: #dbe8ea;
  --on-accent: #ffffff;
  --blocker: #b3261e;
  --blocker-wash: #f6e1df;
  --major: #a84f08;
  --major-wash: #f6e7d6;
  --minor: #63670f;
  --minor-wash: #ecedd4;
  --info: #56636f;
  --good: #2f6b3a;
  --grade-b: #5b7a2a;
  --font-sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius-s: 4px;
  --radius-m: 8px;
  --measure: 66ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12191f; --sheet: #18222a; --ink: #e6ebef; --ink-2: #b9c3cb; --ink-3: #8996a1;
    --line: #2a3640; --line-strong: #3b4954; --petrol: #5fb3bd; --petrol-ink: #8fd0d7; --petrol-wash: #1b3238; --on-accent: #0b1a1d;
    --blocker: #f08a80; --blocker-wash: #3a1f1d; --major: #f0a35c; --major-wash: #3a2a18; --minor: #c9cd6a; --minor-wash: #2e3018;
    --info: #9fb0bd; --good: #7cc58a; --grade-b: #a8c46a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12191f; --sheet: #18222a; --ink: #e6ebef; --ink-2: #b9c3cb; --ink-3: #8996a1;
  --line: #2a3640; --line-strong: #3b4954; --petrol: #5fb3bd; --petrol-ink: #8fd0d7; --petrol-wash: #1b3238; --on-accent: #0b1a1d;
  --blocker: #f08a80; --blocker-wash: #3a1f1d; --major: #f0a35c; --major-wash: #3a2a18; --minor: #c9cd6a; --minor-wash: #2e3018;
  --info: #9fb0bd; --good: #7cc58a; --grade-b: #a8c46a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 4.6vw, 3.25rem); letter-spacing: -0.03em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1875rem; }
p { margin: 0; }
a { color: var(--petrol); text-underline-offset: 3px; }
a:hover { color: var(--petrol-ink); }
code, pre { font-family: var(--font-mono); font-size: 0.875em; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }
.narrow { max-width: 820px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.muted { color: var(--ink-3); }
.small { font-size: 0.8125rem; }
.stack { display: grid; gap: 16px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.0625rem; }
.brand:hover { color: var(--ink); }
.brand svg { width: 22px; height: 22px; flex: none; }
.nav { display: flex; gap: 2px; align-items: center; margin-left: auto; overflow-x: auto; }
.nav a { white-space: nowrap; color: var(--ink-2); text-decoration: none; padding: 6px 10px; font-size: 0.9375rem; }
.nav a:hover { color: var(--ink); }
.nav .sm { display: none; }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--petrol); }
@media (max-width: 560px) { .topbar .wrap { gap: 8px; } .nav a { padding: 6px 7px; font-size: 0.875rem; } .brand span { display: none; } .nav .sm { display: inline; } .nav .lg { display: none; } }

/* controls */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; font-size: 0.9375rem; line-height: 1;
  padding: 11px 16px; border-radius: var(--radius-s); border: 1px solid transparent; background: var(--petrol); color: var(--on-accent); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--petrol-ink); color: var(--on-accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-quiet { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn-quiet:hover { background: var(--sheet); color: var(--ink); }
.btn-small { padding: 7px 11px; font-size: 0.8125rem; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--petrol); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.input, .select { font: inherit; font-size: 0.9375rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 9px 12px; }
.input { width: 100%; }
.input:focus, .select:focus { outline: 2px solid var(--petrol); outline-offset: 0; border-color: var(--petrol); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 0.875rem; }
.hint { font-size: 0.8125rem; color: var(--ink-3); }
.notice { border-left: 3px solid var(--line-strong); padding: 10px 14px; background: var(--sheet); font-size: 0.9375rem; }
.notice-error { border-color: var(--blocker); background: var(--blocker-wash); }
.toggle { position: relative; width: 36px; height: 20px; appearance: none; background: var(--line-strong); border-radius: 999px; cursor: pointer; margin: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); transition: transform .15s; }
.toggle:checked { background: var(--petrol); }
.toggle:checked::after { transform: translateX(16px); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-m); }

/* severity */
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; flex: none; }
.sev-BLOCKER { color: var(--blocker); } .sev-MAJOR { color: var(--major); } .sev-MINOR { color: var(--minor); } .sev-INFO { color: var(--info); }
.grade { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 0.875rem; color: var(--on-accent); flex: none; }
.grade-A { background: var(--good); } .grade-B { background: var(--grade-b); } .grade-C { background: var(--major); } .grade-D { background: var(--blocker); }

/* home */
.hero { padding: 48px 0 40px; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 48px; align-items: start; }
.hero .lede { margin-top: 18px; font-size: 1.1875rem; color: var(--ink-2); max-width: 42ch; }
.hero .facts { margin-top: 22px; display: grid; gap: 8px; color: var(--ink-2); font-size: 0.9375rem; list-style: none; padding: 0; }
.hero .facts li { display: flex; gap: 10px; align-items: baseline; }
.hero .facts li::before { content: ""; width: 6px; height: 6px; background: var(--petrol); border-radius: 1px; flex: none; transform: translateY(-2px); }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 28px; padding-top: 28px; } }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-m); background: var(--sheet); padding: 24px; display: grid; gap: 16px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--petrol); background: var(--petrol-wash); }
.drop p { color: var(--ink-2); }
.samples { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.sample { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.sample code { color: var(--ink); }

.section { padding: 48px 0; border-top: 1px solid var(--line); }
.split { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 48px; }
.split > :first-child p { color: var(--ink-2); margin-top: 12px; max-width: 36ch; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; gap: 20px; } }

.review { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; min-width: 0; }
.review-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.8125rem; color: var(--ink-3); }
.review-head strong { color: var(--ink); font-weight: 600; }
.code { margin: 0; padding: 8px 0; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.7; }
.code-line { display: grid; grid-template-columns: 3.2em max-content; white-space: pre; }
.code-line .ln { color: var(--ink-3); text-align: right; padding-right: 14px; user-select: none; }
.flag-BLOCKER { background: var(--blocker-wash); box-shadow: inset 3px 0 0 var(--blocker); }
.flag-MAJOR { background: var(--major-wash); box-shadow: inset 3px 0 0 var(--major); }
.code-note { font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.45; padding: 3px 14px 8px calc(3.2em + 14px); white-space: normal; max-width: 70ch; }
.code-note .sev { margin-right: 8px; }
.tok-tag { color: var(--petrol); } .tok-attr { color: var(--ink-2); } .tok-val { color: var(--major); }

.catlist { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 40px; }
.catlist li { break-inside: avoid; padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.catlist a { color: var(--ink); text-decoration: none; font-weight: 600; }
.catlist a:hover { color: var(--petrol); }
@media (max-width: 640px) { .catlist { columns: 1; } }
pre.block { margin: 0; padding: 12px 14px; overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-m); font-size: 0.8125rem; }

/* tables */
.table-scroll { overflow-x: auto; }
.ledger { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.ledger th { text-align: left; font-weight: 600; font-size: 0.8125rem; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.ledger td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ledger tr:last-child td { border-bottom: 0; }
.ledger .num { text-align: right; font-variant-numeric: tabular-nums; }
.ledger a, .ledger .linkbtn { color: var(--ink); font-weight: 600; text-decoration: none; }
.ledger a:hover, .ledger .linkbtn:hover { color: var(--petrol); text-decoration: underline; }

/* report */
.page-head { padding: 28px 0 20px; }
.page-head h1 { font-size: clamp(1.75rem, 3.6vw, 2.125rem); }
.page-head p { color: var(--ink-2); margin-top: 6px; }
.report { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; align-items: start; padding-bottom: 64px; }
.report aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 26px; }
@media (max-width: 960px) { .report { grid-template-columns: 1fr; gap: 28px; } .report aside { position: static; } }
.scoreblock { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.dial { width: 112px; height: 112px; }
.counts { display: grid; gap: 4px; font-size: 0.9375rem; }
.counts b { font-variant-numeric: tabular-nums; min-width: 2ch; display: inline-block; }
.cats { display: grid; gap: 10px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 0.875rem; }
.cat b { font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--petrol); }
.bar span.low { background: var(--major); } .bar span.bad { background: var(--blocker); }
.topfix { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.topfix li { display: grid; grid-template-columns: 2.6em 1fr; gap: 8px; font-size: 0.875rem; align-items: baseline; }
.gain { font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
.delta { font-size: 0.875rem; display: grid; gap: 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.chip { font: inherit; font-size: 0.8125rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:disabled { opacity: .45; cursor: default; }
.finding { border-bottom: 1px solid var(--line); }
.finding > button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 88px 60px minmax(0, 1fr); gap: 12px; padding: 13px 4px; align-items: baseline; }
.finding > button:focus-visible { outline: 2px solid var(--petrol); outline-offset: -2px; }
.finding .rid { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-2); }
.finding .msg { font-size: 0.9375rem; overflow-wrap: anywhere; }
.finding .loc { display: block; color: var(--ink-3); font-size: 0.8125rem; margin-top: 2px; font-family: var(--font-mono); overflow-wrap: anywhere; }
.finding .new { font-size: 0.75rem; font-weight: 600; color: var(--petrol); margin-left: 6px; }
.finding.ignored .msg { text-decoration: line-through; color: var(--ink-3); }
.finding-body { padding: 0 4px 18px calc(88px + 60px + 24px); display: grid; gap: 12px; }
.finding-body pre { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; overflow-x: auto; font-size: 0.8125rem; }
.finding-body .why { color: var(--ink-2); font-size: 0.9375rem; max-width: var(--measure); }
@media (max-width: 640px) { .finding > button { grid-template-columns: auto 1fr; gap: 4px 10px; } .finding > button > :last-child { grid-column: 1 / -1; } .finding-body { padding-left: 4px; } }
.empty { padding: 28px; color: var(--ink-2); }
.progress { padding: 32px; display: grid; gap: 12px; }
.progress ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.progress li { display: flex; gap: 10px; align-items: center; color: var(--ink-3); }
.progress li.done { color: var(--ink); } .progress li.now { color: var(--petrol); font-weight: 600; }
.progress li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
.progress li.done::before { background: currentColor; }

/* rules */
.rule-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 96px; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.rule-row .rid { font-family: var(--font-mono); font-size: 0.875rem; }
.rule-row a { color: var(--ink); text-decoration: none; font-weight: 600; }
.rule-row a:hover { color: var(--petrol); text-decoration: underline; }
@media (max-width: 560px) { .rule-row { grid-template-columns: 64px 1fr; } .rule-row .sev { grid-column: 2; } }
.prose { max-width: var(--measure); }
.prose h2 { margin: 28px 0 8px; font-size: 1.1875rem; }
.prose p { color: var(--ink-2); }
.cat-head { font-size: 1.1875rem; padding-bottom: 8px; border-bottom: 2px solid var(--ink); margin-top: 32px; scroll-margin-top: 90px; }

.params { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.savebar { position: sticky; bottom: 0; background: var(--paper); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--radius-s); font-size: 0.9375rem; z-index: 50; max-width: calc(100% - 32px); }
.footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--ink-3); font-size: 0.8125rem; }
.account { display: flex; align-items: center; gap: 10px; flex: none; }
.account .who { display: grid; line-height: 1.2; text-align: right; font-size: 0.875rem; max-width: 220px; }
.account .who b, .account .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-wrap { display: grid; place-items: center; padding-top: 40px; padding-bottom: 64px; }
.auth-card { width: 100%; max-width: 440px; padding: 28px; }
.auth-card h1 { font-size: 1.75rem; }
.drop.gate { border-style: solid; }
@media (max-width: 900px) { .account .who { display: none; } }
@media (max-width: 560px) { .hide-xs { display: none !important; } .topbar .wrap { flex-wrap: wrap; row-gap: 0; padding-bottom: 8px; } .account { margin-left: auto; } }
.credit { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="7" width="8" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 12h4" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="7" width="9" height="10" rx="2" fill="var(--petrol)"/><path d="M15.8 12.2l1.8 1.8 3.2-3.6" fill="none" stroke="var(--on-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>MuleLint</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#" data-nav="home"><span class="lg">Check an app</span><span class="sm">Check</span></a>
      <a href="#report" data-nav="report">Report</a>
      <a href="#history" data-nav="history">History</a>
      <a href="#rule-profile" data-nav="rule-profile"><span class="lg">Rule profile</span><span class="sm">Profile</span></a>
      <a href="#rules" data-nav="rules">Rules</a>
    </nav>
    <div class="account" id="account"></div>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<footer class="footer">
  <div class="wrap spread">
    <span>MuleLint checks Mule 4 applications against integration best practices. Files are read in this browser and never uploaded.</span>
    <a href="#rules">Rule catalog</a>
  </div>
  <div class="wrap">
    <p class="credit">&copy; <span id="year">2026</span> All rights reserved to Hemant Raghuwanshi, Solution Consultant (Caelius Consulting)</p>
  </div>
</footer>
<script>try { document.getElementById("year").textContent = new Date().getFullYear(); } catch (e) {}</script>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="mulelint-core.js"></script>
<script src="samples.js"></script>
<script src="app.js"></script>

</body>
</html>
